# OpenShell gateway — podman compose setup (Podman compute driver)
#
# Quick start:
#
#   1. Start the gateway:
#        podman compose up -d
#
#   2. Register the gateway with the CLI (one-time):
#        openshell gateway add http://localhost:8080 --name openshell-podman
#
#   3. Configure an AI provider (example: Anthropic):
#        ANTHROPIC_API_KEY=sk-ant-... \
#          openshell provider create --type anthropic --from-existing
#
#   4. Create a sandboxed agent — Claude Code:
#        openshell sandbox create -- claude
#      For OpenClaw, use NemoClaw: https://github.com/NVIDIA/NemoClaw
#
# Sandbox containers are managed by the gateway, not by this Compose file.
# Each `openshell sandbox create` call launches a fresh container; the gateway
# tracks their lifecycle.
#
# Configuration:
#   All gateway and driver settings live in gateway.toml in this directory.
#   Three values cannot be expressed in the TOML file and remain as env vars:
#     - OPENSHELL_DB_URL  (explicitly blocked from the config file to prevent
#                          secrets from being committed to VCS)
#     - XDG_DATA_HOME / HOME  (OS-level path-resolution vars outside the
#                               gateway config schema)
#
# command: [] note:
#   The gateway image's default CMD is ["--bind-address", "0.0.0.0", "--port",
#   "8080"].  CLI flags beat TOML in the merge order, so without clearing the
#   CMD the TOML's bind_address = "127.0.0.1:8080" is silently ignored and the
#   gateway binds 0.0.0.0.  Setting command: [] lets the TOML file own all
#   gateway settings.
#
# Data directory note:
#   ${HOME}/.local/share/openshell is bind-mounted at the SAME absolute path in
#   both the host and the container.  This is required so that the supervisor
#   binary extracted from the supervisor image can be passed to Podman as a
#   host-side bind-mount source when sandbox containers are created.  Named
#   volumes cannot be used here because Podman resolves bind-mount sources
#   against the host filesystem, not the container filesystem.
#   A home-directory path is used (rather than /var/lib/openshell) because
#   Fedora Silverblue's system directories are immutable / read-only.
#
# Linux note:
#   host.containers.internal and host.openshell.internal are mapped via
#   extra_hosts under the gateway service:
#     extra_hosts:
#       - "host.containers.internal:host-gateway"
#       - "host.openshell.internal:host-gateway"

services:
  gateway:
    image: ghcr.io/nvidia/openshell/gateway:${IMAGE_TAG:-latest}
    container_name: openshell-gateway
    restart: unless-stopped

    # Clear the default CMD so gateway.toml owns all settings (see note above).
    command: []

    # Run as internal UID 0. In this rootless Podman setup, container UID 0 maps
    # to the host user (michael) who owns the Podman socket, the data directory,
    # and gateway.toml. Running as the image's default UID 1000 instead maps to
    # an unrelated high subuid (see /etc/subuid), which cannot access the
    # host-owned Podman socket ("/var/run/podman.sock: Permission denied") and
    # would require chowning the data dir. Running as 0:0 keeps all host files
    # owned by michael and grants socket access with no uid juggling.
    user: "0:0"

    # Disable SELinux confinement for this container. Its sole purpose is to
    # drive the host Podman socket to create sibling sandbox containers, which
    # requires access the default container_t domain forbids — even as UID 0 the
    # gateway otherwise gets "/var/run/podman.sock: Permission denied (os error
    # 13)" on SELinux-enforcing hosts (Fedora Silverblue). This is the standard
    # approach for a Podman-socket management container.
    security_opt:
      - label=disable

    ports:
      # gRPC / control-plane API  (used by the openshell CLI and sandbox callbacks)
      # The Podman driver injects host.containers.internal:<gateway-port> into sandbox
      # containers as the callback endpoint.  The gateway's internal port is 8080, so
      # host port 8080 must be published at the same number so that
      # host.containers.internal:8080 routes to the gateway container.
      # gateway.toml binds to 127.0.0.1 — the Podman driver adds the bridge listener
      # automatically so sandbox containers can reach the gateway without 0.0.0.0.
      - "127.0.0.1:${OPENSHELL_PORT:-8080}:8080"
      # Health endpoint  (GET /healthz, GET /readyz)
      - "127.0.0.1:${OPENSHELL_HEALTH_PORT:-8081}:8081"
    
    # Join the openshell bridge network in addition to the compose default network.
    # Sandboxes run on the openshell network and need to reach the gateway
    # directly via the bridge (not routing through the host). This avoids
    # exposing the unauthenticated gateway on 0.0.0.0 to the external network.
    networks:
      openshell:

    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.openshell.internal:host-gateway"

    volumes:
      # Podman socket — lets the gateway create and manage sandbox containers.
      # No :z relabel here: relabeling the live host socket to container_file_t
      # can disrupt the host Podman service. SELinux access is instead granted
      # via security_opt: label=disable above, and UID access via user: "0:0"
      # (container UID 0 == host michael == socket owner).
      - $XDG_RUNTIME_DIR/podman/podman.sock:/var/run/podman.sock

      # Data directory — must be a bind-mount with source == target so that
      # paths written inside the container are resolvable by Podman when it
      # creates sandbox containers (see note above).
      # Using home directory path that matches on both host and container.
      # This is required for Fedora Silverblue where system paths are immutable.
      #
      # NOTE: short-string syntax is used (with the :z suffix) instead of the
      # long "type: bind" form because podman-compose does not honor
      # x-podman.mount-options / SELinux options on long-syntax mounts.
      #   :z  — SELinux relabel to container_file_t so the container can access
      #         the files on SELinux-enforcing hosts (Fedora Silverblue).
      #         Without it the gateway fails to read/write here with
      #         "Permission denied (os error 13)" / "unable to open database
      #         file" (SQLite code 14).
      # No :U chown is needed: with user: "0:0" the container writes as the host
      # user (michael) who already owns this directory. Files created here
      # (gateway.db, extracted supervisor binary, state/) stay owned by michael.
      - ${HOME}/.local/share/openshell:${HOME}/.local/share/openshell:z

      # TOML config — all gateway and driver settings live here.
      # Podman Compose resolves ./ relative to the directory that contains this
      # compose.yaml file, not the CWD of the caller.
      # Read-only + :z SELinux relabel (see note above).
      - ./gateway.toml:/etc/openshell/gateway.toml:ro,z

      # JWT signing keys for sandbox authentication.
      # Generated with: openssl genpkey -algorithm ed25519
      # Read-only + :z SELinux relabel.
      - ${HOME}/.config/openshell/jwt:${HOME}/.config/openshell/jwt:ro,z

    environment:
      # Point the gateway at the TOML config file mounted above.
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_PODMAN_SOCKET: /var/run/podman.sock
      OPENSHELL_DRIVERS: podman

      # Database URL cannot be set in the TOML config file — it is explicitly
      # blocked there to prevent credential-bearing URLs (e.g. postgresql://user:pass@host/db)
      # from being committed to VCS.  A plain SQLite path contains no credentials, so it
      # is safe to include here.  Swap this for a real DSN via an env file or secret if
      # you switch to an external database.
      OPENSHELL_DB_URL: "sqlite:${HOME}/.local/share/openshell/gateway.db?mode=rwc"

      # XDG path variables are OS-level; they are not part of the gateway config
      # schema.  Setting them ensures the extracted supervisor binary lands in the
      # bind-mounted directory so its path is resolvable by the host Podman daemon.
      XDG_DATA_HOME: ${HOME}/.local/share
      HOME: ${HOME}

      # State directory (credential key-encryption key, local TLS material, etc.).
      # The gateway resolves this via XDG_STATE_HOME, defaulting to
      # $HOME/.local/state/openshell. That default path is NOT bind-mounted into
      # the container, so the gateway fails to create
      # $XDG_STATE_HOME/openshell/gateway/credentials/key-encryption-key.bin.
      # Point it inside the mounted, writable data dir so all persistent state
      # lives under the single ~/.local/share/openshell bind mount.
      XDG_STATE_HOME: ${HOME}/.local/share/openshell/state

networks:
  # The openshell network is created externally by the Podman driver on first
  # gateway startup. The gateway must join this network so sandbox containers
  # can reach it directly via the bridge, avoiding the need to publish the
  # unauthenticated gateway API on 0.0.0.0 (external network exposure).
  openshell:
    external: true
