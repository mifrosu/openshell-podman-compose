# OpenShell gateway TOML configuration — Podman compute driver.
#
# This file is the primary configuration source for compose.yaml in this
# directory.  It is mounted read-only at /etc/openshell/gateway.toml inside the
# gateway container and loaded via OPENSHELL_GATEWAY_CONFIG.
#
# Why compose.yaml sets command: []:
#   The gateway image's default CMD passes --bind-address 0.0.0.0 --port 8080
#   as explicit CLI flags.  CLI flags beat the TOML file in the merge order, so
#   bind_address = "127.0.0.1:8080" below would be silently ignored without
#   clearing the CMD first.
#
# grpc_endpoint note:
#   host.containers.internal is Podman's equivalent to host.docker.internal.
#   On Linux, extra_hosts are added in compose.yaml:
#     extra_hosts:
#       - "host.containers.internal:host-gateway"
#       - "host.openshell.internal:host-gateway"

[openshell]
version = 1

[openshell.gateway]
# Bind to all interfaces inside the container so sandbox containers on the
# openshell bridge network can reach the gateway directly. The gateway joins
# the openshell network via compose.yaml, so it gets a bridge IP and sandboxes
# can connect without routing through the host.
bind_address        = "0.0.0.0:8080"
# Bind the health server to 0.0.0.0 inside the container so the published host
# port (127.0.0.1:8081 -> container:8081 in compose.yaml) can reach it. Unlike
# the primary gRPC port, the Podman driver does NOT add an extra bridge listener
# for the health port, so leaving this at 127.0.0.1 makes it reachable only from
# the container's own loopback and the host health check fails with a connection
# reset. The host publish rule still restricts external exposure to loopback.
health_bind_address = "0.0.0.0:8081"
log_level           = "info"
compute_drivers     = ["podman"]
disable_tls         = true

[openshell.drivers.podman]
# Default image pulled for `openshell sandbox create` without --from.
default_image     = "ghcr.io/nvidia/openshell-community/sandboxes/base:latest"
# Supervisor image from which the openshell-sandbox binary is extracted on
# first start.  The binary is cached to XDG_DATA_HOME and reused on restart.
supervisor_image  = "ghcr.io/nvidia/openshell/supervisor:latest"
# Only pull images that are not already cached locally.
# Valid values: "always", "missing", "never", "newer". "missing" pulls only
# when the image is not already present locally (the Docker/K8s "IfNotPresent"
# equivalent).
image_pull_policy = "missing"
# Address sandbox containers use to call back to the gateway.
# Both the gateway and sandboxes run on the openshell bridge network, so
# sandboxes can reach the gateway directly via Podman's built-in DNS using the
# gateway's container name (set in compose.yaml). No host routing needed.
grpc_endpoint     = "http://openshell-gateway:8080"
